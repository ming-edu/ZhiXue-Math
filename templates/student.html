<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学生端 - 智学数学</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% include '_sprite.html' %}
<div class="topbar">
  <div class="logo"><span class="logo-mark"><svg class="icon"><use href="#i-logo"/></svg></span>智学数学</div>
  <nav>
    <a href="/"><svg class="icon"><use href="#i-home"/></svg>概览</a>
    <a href="/teacher/create"><svg class="icon"><use href="#i-clipboard"/></svg>布置作业</a>
    <a href="/teacher/review"><svg class="icon"><use href="#i-check-circle"/></svg>批改中心</a>
    <a href="/student" class="active"><svg class="icon"><use href="#i-users"/></svg>学生端</a>
  </nav>
</div>
<div class="container">
  <div class="page-header">
    <div><h1>学生端 · 拍照上传与个性化练习</h1>
      <p>选择学生后拍照上传作业，系统 OCR 识别、自动判分，并针对错题生成变式训练。</p></div>
  </div>

  <div class="panel">
    <div class="form-row">
      <div class="form-group"><label>选择班级</label><select id="sClass" onchange="loadStudents()"></select></div>
      <div class="form-group"><label>选择学生</label><select id="sStudent" onchange="loadAll()"></select></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab(this,'t-upload')"><svg class="icon"><use href="#i-camera"/></svg>拍照交作业</div>
    <div class="tab" onclick="switchTab(this,'t-wrong')"><svg class="icon"><use href="#i-book"/></svg>我的错题</div>
    <div class="tab" onclick="switchTab(this,'t-variant')"><svg class="icon"><use href="#i-sparkles"/></svg>变式训练</div>
    <div class="tab" onclick="switchTab(this,'t-me')"><svg class="icon"><use href="#i-chart"/></svg>我的学情</div>
  </div>

  <div id="t-upload" class="tab-content active">
    <div class="panel" style="border:1px solid var(--brand-soft);background:linear-gradient(135deg,var(--brand-tint),#fff)">
      <h2><svg class="icon"><use href="#i-sparkles"/></svg>交整份作业 · AI 自动批改</h2>
      <p class="panel-sub">选择作业，把写好的整页作业拍下来，AI 逐题比对标准答案自动批改。</p>
      <div class="form-group"><label>选择作业</label><select id="gAssignment"></select></div>
      <label class="upload-box" for="gImage">
        <svg class="icon" style="width:30px;height:30px"><use href="#i-camera"/></svg>
        <span id="gHint">点击选择整页作业照片（可拍照）</span>
      </label>
      <input type="file" id="gImage" accept="image/*" capture="environment" style="display:none">
      <img id="gPreview" style="max-width:300px;max-height:200px;margin-top:12px;display:none;border-radius:12px;box-shadow:var(--sh-md)">
      <button class="btn btn-primary" id="gBtn" style="margin-top:16px" onclick="gradePage()" disabled>
        <svg class="icon"><use href="#i-sparkles"/></svg>提交整页并自动批改
      </button>
      <div id="gResult" style="margin-top:16px"></div>
    </div>

    <div class="panel" style="margin-top:18px">
      <h2><svg class="icon"><use href="#i-upload"/></svg>单题上传（备用）</h2>
      <p class="panel-sub">只交某一道题时用这里：拍照 OCR 识别，或勾选手动输入直接判分。</p>
      <div class="form-group"><label>选择题目</label><select id="uQuestion"></select></div>
      <label class="upload-zone">
        <input type="file" id="uImage" accept="image/*" style="display:none" onchange="preview()">
        <div class="up-icon"><svg class="icon"><use href="#i-camera"/></svg></div>
        <p>点击选择作业照片（或拍照）<small id="fileName">支持 JPG / PNG 格式</small></p>
      </label>
      <img id="previewImg" style="max-width:320px;max-height:220px;margin-top:14px;display:none;border-radius:12px;box-shadow:var(--sh-md)">
      <div style="margin-top:18px">
        <label class="checkbox-label"><input type="checkbox" id="uManual"> 手动输入答案（跳过 OCR，推荐用于演示）</label>
        <input id="uAnswer" placeholder="学生答案，如 4.6" style="display:none;margin-top:10px;width:240px">
      </div>
      <button class="btn" style="margin-top:18px" onclick="submitHomework()"><svg class="icon"><use href="#i-check"/></svg>提交批改</button>
      <div id="uResult" style="margin-top:18px"></div>
    </div>
  </div>

  <div id="t-wrong" class="tab-content">
    <div class="panel"><h2><svg class="icon"><use href="#i-book"/></svg>我的错题本</h2><div id="wrongList" style="margin-top:14px"></div></div>
  </div>

  <div id="t-variant" class="tab-content">
    <div class="panel">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div><h2 style="margin:0"><svg class="icon"><use href="#i-sparkles"/></svg>个性化变式训练</h2>
          <p class="panel-sub" style="margin-bottom:0">根据你的薄弱知识点自动生成。先独立思考，再点开答案对照。</p></div>
        <button class="btn btn-primary" onclick="regenVariants()" id="regenBtn"><svg class="icon"><use href="#i-refresh"/></svg>再出几道新题</button>
      </div>
      <div id="variantList" style="margin-top:18px"></div>
    </div>
  </div>

  <div id="t-me" class="tab-content">
    <div class="panel"><h2><svg class="icon"><use href="#i-chart"/></svg>我的学情诊断</h2><div id="myAnalysis" style="margin-top:14px"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/store.js"></script>
<script src="/static/analyzer.js"></script>
<script>
let classes=[],students=[],questions=[];
function toast(m,t){const e=document.getElementById('toast');e.textContent=m;e.className='toast'+(t?' '+t:'');e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function switchTab(el,id){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');document.getElementById(id).classList.add('active');
}
async function init(){
  await Store.init();
  await Store.loadKG();
  classes=Store.all('classes');
  document.getElementById('sClass').innerHTML=classes.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')||'<option value="">（无班级）</option>';
  await loadStudents();
  document.getElementById('uManual').onchange=function(){
    document.getElementById('uAnswer').style.display=this.checked?'block':'none';
  };
  document.getElementById('gImage').onchange=function(e){
    const f=e.target.files[0];if(!f)return;
    document.getElementById('gHint').textContent='已选：'+f.name;
    const r=new FileReader();r.onload=ev=>{const img=document.getElementById('gPreview');img.src=ev.target.result;img.style.display='block'};r.readAsDataURL(f);
    document.getElementById('gBtn').disabled=false;
  };
}
async function loadStudents(){
  const cid=document.getElementById('sClass').value;
  students=Store.where('students',s=>s.class_id===Number(cid)).sort((a,b)=>(a.student_no||0)-(b.student_no||0));
  document.getElementById('sStudent').innerHTML=students.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')||'<option value="">（无学生）</option>';
  const assignments=Store.where('assignments',a=>a.class_id===Number(cid));
  document.getElementById('gAssignment').innerHTML=assignments.map(a=>`<option value="${a.id}">${a.title}（${Store.where('questions',q=>q.assignment_id===a.id).length}题）</option>`).join('')||'<option value="">（无作业）</option>';
  let allQ=[];
  assignments.forEach(a=>{
    Store.where('questions',q=>q.assignment_id===a.id).sort((x,y)=>(x.sort_order||0)-(y.sort_order||0)).forEach(q=>allQ.push({...q,assignmentTitle:a.title}));
  });
  questions=allQ;
  document.getElementById('uQuestion').innerHTML=allQ.map(q=>`<option value="${q.id}">${q.question_text.slice(0,32)}…（${q.assignmentTitle}）</option>`).join('')||'<option value="">（无题目）</option>';
  loadAll();
}
function preview(){
  const f=document.getElementById('uImage').files[0];if(!f)return;
  document.getElementById('fileName').textContent='已选：'+f.name;
  const r=new FileReader();r.onload=e=>{const img=document.getElementById('previewImg');img.src=e.target.result;img.style.display='block'};r.readAsDataURL(f);
}
async function gradePage(){
  const aid=document.getElementById('gAssignment').value;
  const sid=document.getElementById('sStudent').value;
  const file=document.getElementById('gImage').files[0];
  if(!aid)return toast('请选择作业','err');
  if(!file)return toast('请选择整页作业照片','err');
  const btn=document.getElementById('gBtn');
  btn.disabled=true;btn.innerHTML='<svg class="icon"><use href="#i-loader"/></svg>AI 正在逐题批改，请稍候…';
  const fd=new FormData();fd.append('image',file);
  const qs=Store.where('questions',q=>q.assignment_id===Number(aid)).sort((x,y)=>(x.sort_order||0)-(y.sort_order||0));
  const payload=qs.map((q,i)=>({id:q.id,no:i+1,text:q.question_text,answer:q.standard_answer,
    q_type:q.q_type,analysis:q.analysis,knowledge_point:q.knowledge_point,
    grading_mode:q.grading_mode||'score',score:q.score||10}));
  fd.append('questions',JSON.stringify(payload));
  try{
    const r=await fetch('/api/ai/grade-page',{method:'POST',body:fd}).then(r=>r.json());
    if(r.error)throw new Error(r.error);
    // 写入本地：提交记录 + 学习记录
    r.graded.forEach(g=>{
      const score=g.grading_mode==='passfail'?(g.is_correct?(g.full_score||10):0):(g.is_correct?(g.full_score||10):0);
      Store.insert('submissions',{question_id:g.question_id,student_id:Number(sid),image_path:r.image_path,
        ocr_text:'（AI直接读图批改）',student_answer:g.student_answer,answer_source:'ai_grade',
        score,is_correct:g.is_correct?1:0,needs_review:0,graded_at:new Date().toISOString()});
      Store.insert('learning_records',{student_id:Number(sid),knowledge_point:g.knowledge_point,
        correct:g.is_correct?1:0,score,timestamp:new Date().toISOString()});
    });
    const right=r.graded.filter(g=>g.is_correct).length;
    document.getElementById('gResult').innerHTML=`
      <div class="result-card ${right===r.graded.length?'ok':'no'}" style="margin-bottom:12px">
        <b>批改完成：${right}/${r.graded.length} 题正确</b>
        <p style="font-size:12.5px;margin-top:6px">已自动记入错题本与学情分析</p></div>
      ${r.graded.map(g=>`<div class="point-card" style="border-left:3px solid ${g.is_correct?'var(--green)':'var(--red)'}">
        <div class="name">第${g.no}题 · ${g.is_correct?'<span style="color:var(--green)">✓ 正确</span>':'<span style="color:var(--red)">✗ 错误</span>'} 
          <span style="color:var(--muted);font-weight:500;font-size:12px">${g.grading_mode==='passfail'?'对错制':'赋分制'}</span></div>
        <div class="desc">题目：${g.text.slice(0,50)}<br>你的答案：<b>${g.student_answer||'（未识别）'}</b>
          ${!g.is_correct&&g.analysis?`<br>💡 ${g.analysis}`:''}</div></div>`).join('')}`;
    toast(`批改完成：${right}/${r.graded.length} 题正确`,'ok');
    loadAll();
  }catch(e){toast('批改失败：'+e.message,'err');document.getElementById('gResult').innerHTML=`<div style="color:var(--red);font-size:13px">${e.message}</div>`}
  finally{btn.disabled=false;btn.innerHTML='<svg class="icon"><use href="#i-sparkles"/></svg>提交整页并自动批改'}
}
async function submitHomework(){
  const qid=document.getElementById('uQuestion').value;
  const sid=document.getElementById('sStudent').value;
  if(!qid||!sid)return toast('请选择学生和题目','err');
  const q=Store.get('questions',Number(qid));
  const answer=document.getElementById('uAnswer').value.trim();
  if(!answer)return toast('请填写学生答案（照片仅作凭证，判分按输入的答案）','err');
  // 调无状态判分接口
  const r=await fetch('/api/ai/judge',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({student_answer:answer,standard_answer:q.standard_answer,q_type:q.q_type,scoring_rule:q.scoring_rule||''})}).then(r=>r.json());
  const mode=q.grading_mode||'score';
  const score=r.is_correct?(q.score||10):0;
  Store.insert('submissions',{question_id:q.id,student_id:Number(sid),image_path:null,
    ocr_text:'',student_answer:answer,answer_source:'manual',score,
    is_correct:r.is_correct?1:0,needs_review:0,graded_at:new Date().toISOString()});
  Store.insert('learning_records',{student_id:Number(sid),knowledge_point:q.knowledge_point,
    correct:r.is_correct?1:0,score,timestamp:new Date().toISOString()});
  document.getElementById('uResult').innerHTML=`<div class="result-card ${r.is_correct?'ok':'no'}">
    <b>${r.is_correct?'✓ 回答正确！':'✗ 回答错误'}</b>
    <p style="font-size:12.5px;margin-top:6px">得分：${score} · ${r.note||''}${mode==='passfail'?'（对错制）':''}</p>
    ${!r.is_correct&&q.analysis?`<p style="font-size:12.5px;margin-top:6px">💡 解析：${q.analysis}</p>`:''}</div>`;
  toast('提交成功','ok');
  loadAll();
}
async function loadAll(){loadWrong();loadVariants();loadMyAnalysis()}
async function loadWrong(){
  const sid=document.getElementById('sStudent').value;
  const qmap={};Store.all('questions').forEach(q=>qmap[q.id]=q);
  const subs=Store.where('submissions',s=>s.student_id===Number(sid)).map(s=>{
    const q=qmap[s.question_id]||{};
    return Object.assign({},s,{question_text:q.question_text||'',standard_answer:q.standard_answer||'',analysis:q.analysis||''});
  });
  const wrong=subs.filter(s=>!s.is_correct);
  document.getElementById('wrongList').innerHTML=wrong.length?wrong.map(s=>`
    <div class="point-card"><div class="name">${s.question_text.slice(0,44)}${s.question_text.length>44?'…':''}</div>
    <div class="desc">你的答案：<b style="color:var(--red)">${s.student_answer}</b> · 标准答案：<b style="color:var(--green)">${s.standard_answer}</b> ${s.analysis?'<br>💡 '+s.analysis:''}</div></div>`).join('')
    :'<div class="empty"><svg class="icon"><use href="#i-check-circle"/></svg><p>暂无错题，继续保持！</p></div>';
}
async function loadVariants(){
  const sid=document.getElementById('sStudent').value;
  if(!sid){window._variants=[];renderVariants();return}
  const v=Analyzer.generateVariantSet({student_id:Number(sid)},5);
  window._variants=v;
  renderVariants();
}
function renderVariants(){
  const v=window._variants||[];
  document.getElementById('variantList').innerHTML=v.length?v.map((e,i)=>`
    <div class="exercise-card">
      <div class="ex-head"><span class="ex-num">变式 ${i+1}</span><span class="ex-kp">${e.knowledge_point} · 正确率${(e.source_accuracy*100).toFixed(0)}%</span></div>
      <div class="ex-text">${e.question_text}</div>
      <button class="answer-toggle" onclick="toggleAnswer(${i})" id="at_${i}"><svg class="icon"><use href="#i-eye"/></svg>显示答案</button>
      <div class="answer-box" id="ab_${i}" style="display:none">
        <div class="ex-answer">参考答案：<b>${e.answer}</b></div>
        <div class="ex-analysis">💡 ${e.analysis}</div>
      </div>
    </div>`).join(''):'<div class="empty"><svg class="icon"><use href="#i-check-circle"/></svg><p>暂无薄弱点，无需变式训练</p></div>';
}
function toggleAnswer(i){
  const box=document.getElementById('ab_'+i),btn=document.getElementById('at_'+i);
  const show=box.style.display==='none';
  box.style.display=show?'block':'none';
  btn.innerHTML=show?'<svg class="icon"><use href="#i-eye-off"/></svg>隐藏答案':'<svg class="icon"><use href="#i-eye"/></svg>显示答案';
}
async function regenVariants(){
  const sid=document.getElementById('sStudent').value;
  if(!sid)return toast('请先选择学生','err');
  const v=Analyzer.generateVariantSet({student_id:Number(sid)},5);
  window._variants=v;renderVariants();
  toast('已生成 '+v.length+' 道新题','ok');
}
async function loadMyAnalysis(){
  const sid=document.getElementById('sStudent').value;
  if(!sid){document.getElementById('myAnalysis').innerHTML='<div class="empty"><p>请先选择学生</p></div>';return}
  const weak=Analyzer.weakPoints({student_id:Number(sid)});
  const an={weak_points:weak,competency:Analyzer.competencyDiagnosis(weak)};
  const kp=an.competency.slice(0,5);
  document.getElementById('myAnalysis').innerHTML=`
    <h3 style="font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px"><svg class="icon" style="color:var(--brand-2)"><use href="#i-brain"/></svg>最需关注的素养</h3>
    ${kp.map(d=>`<div class="comp-item"><div class="comp-top"><span class="comp-name">${d.competency} <span class="comp-domain">${d.domain}</span></span>
      <b style="color:${d.level<70?'var(--red)':d.level<85?'var(--orange)':'var(--green)'}">${d.level}</b></div></div>`).join('')}
    <h3 style="font-size:14px;font-weight:800;margin:20px 0 12px;display:flex;align-items:center;gap:8px"><svg class="icon" style="color:var(--brand-2)"><use href="#i-trending"/></svg>薄弱知识点</h3>
    ${an.weak_points.length?an.weak_points.map(w=>`<div class="point-card"><div class="name">${w.knowledge_point} <span class="pct">${(w.accuracy*100).toFixed(0)}%</span></div></div>`).join(''):'<div class="empty"><p>暂无明显薄弱点</p></div>'}`;
}
init();
</script>
</body>
</html>
