<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>批改中心 - 智学数学</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% include '_sprite.html' %}
<div class="topbar">
  <div class="logo"><span class="logo-mark"><svg class="icon"><use href="#i-logo"/></svg></span>智学数学</div>
  <nav>
    <a href="/"><svg class="icon"><use href="#i-home"/></svg>概览</a>
    <a href="/teacher/create"><svg class="icon"><use href="#i-clipboard"/></svg>布置作业</a>
    <a href="/teacher/review" class="active"><svg class="icon"><use href="#i-check-circle"/></svg>批改中心</a>
    <a href="/student"><svg class="icon"><use href="#i-users"/></svg>学生端</a>
  </nav>
</div>
<div class="container">
  <div class="page-header">
    <div>
      <a href="/" class="back-link"><svg class="icon"><use href="#i-chevron"/></svg>返回</a>
      <h1>批改中心</h1>
      <p>点学生姓名查看其上传的作业照片，人工判断后修正批改结果。</p>
    </div>
  </div>

  <div class="panel">
    <div class="form-row">
      <div class="form-group"><label>筛选班级</label><select id="fClass" onchange="loadSubmissions()"><option value="">全部班级</option></select></div>
      <div class="form-group"><label>筛选状态</label><select id="fStatus" onchange="loadSubmissions()">
        <option value="">全部</option><option value="review">待复核</option><option value="wrong">错题</option><option value="correct">正确</option>
      </select></div>
    </div>
  </div>
  <div class="panel">
    <h2><svg class="icon"><use href="#i-check-circle"/></svg>提交记录 <span class="badge" id="subCount">0</span></h2>
    <div id="subList" style="margin-top:14px"></div>
  </div>
</div>

<!-- 看图复核弹窗 -->
<div class="modal-mask" id="modal" style="display:none">
  <div class="modal-box">
    <div class="modal-head">
      <h3><svg class="icon"><use href="#i-eye"/></svg>复核学生作业 <span id="mStudent"></span></h3>
      <button class="icon-btn" onclick="closeModal()" title="关闭">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-img-wrap">
        <div id="mImgEmpty" class="img-empty"><svg class="icon"><use href="#i-image"/></svg><p>该提交没有作业照片<br>（手动录入的成绩）</p></div>
        <img id="mImg" style="display:none" alt="学生上传的作业">
      </div>
      <div class="modal-info">
        <div class="mi-block"><label>题目</label><div id="mQuestion" class="mi-text"></div></div>
        <div class="mi-block"><label>标准答案</label><div id="mStandard" class="mi-text ok"></div></div>
        <div class="mi-block"><label>学生答案</label><input id="mAnswer" class="mi-input" placeholder="可修改学生答案"></div>
        <div class="mi-block"><label>人工判定</label>
          <div class="verdict-group">
            <button class="verdict-btn yes" id="vYes" onclick="setVerdict(1)"><svg class="icon"><use href="#i-check"/></svg>正确</button>
            <button class="verdict-btn no" id="vNo" onclick="setVerdict(0)"><svg class="icon"><use href="#i-x"/></svg>错误</button>
          </div>
        </div>
        <div id="mTip" class="m-tip"></div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveVerdict()"><svg class="icon"><use href="#i-check"/></svg>保存批改结果</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="/static/store.js"></script>
<script>
let subs=[], current=null, verdict=null;
function toast(m,t){const e=document.getElementById('toast');e.textContent=m;e.className='toast'+(t?' '+t:'');e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
function buildSubs(){
  const students={},questions={};
  Store.all('students').forEach(s=>students[s.id]=s);
  Store.all('questions').forEach(q=>questions[q.id]=q);
  return Store.all('submissions').map(sub=>{
    const s=students[sub.student_id]||{}, q=questions[sub.question_id]||{};
    return Object.assign({},sub,{student_name:s.name||'未知',class_id:s.class_id,
      question_text:q.question_text||'',standard_answer:q.standard_answer||'',q_type:q.q_type||''});
  }).sort((a,b)=>String(b.graded_at||'').localeCompare(String(a.graded_at||'')));
}
async function init(){
  await Store.init();
  const cs=Store.all('classes');
  document.getElementById('fClass').innerHTML='<option value="">全部班级</option>'+cs.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  loadSubmissions();
}
async function loadSubmissions(){
  subs=buildSubs();
  const cls=document.getElementById('fClass').value;
  const status=document.getElementById('fStatus').value;
  if(cls)subs=subs.filter(s=>String(s.class_id)===cls);
  if(status==='review')subs=subs.filter(s=>s.needs_review);
  if(status==='wrong')subs=subs.filter(s=>!s.is_correct);
  if(status==='correct')subs=subs.filter(s=>s.is_correct);
  document.getElementById('subCount').textContent=subs.length;
  render();
}
function render(){
  if(!subs.length){document.getElementById('subList').innerHTML='<div class="empty"><svg class="icon"><use href="#i-check-circle"/></svg><p>暂无提交记录</p></div>';return}
  document.getElementById('subList').innerHTML=`<div class="table-wrap"><table><thead><tr><th>学生</th><th>题目</th><th>学生答案</th><th>标准答案</th><th>得分</th><th>状态</th><th>操作</th></tr></thead><tbody>`+
    subs.map(s=>{
      let status=s.needs_review?'<span class="status-review"><svg class="icon"><use href="#i-clock"/></svg>待复核</span>':s.is_correct?'<span class="status-correct"><svg class="icon"><use href="#i-check"/></svg>正确</span>':'<span class="status-wrong"><svg class="icon"><use href="#i-x"/></svg>错误</span>';
      const hasImg=!!s.image_path;
      return `<tr class="${s.needs_review?'review-row':''}">
        <td><a href="javascript:void(0)" class="student-link" onclick="openReview(${s.id})" title="点击查看作业照片"><b>${s.student_name}</b>${hasImg?' <svg class="icon" style="width:13px;height:13px;vertical-align:middle"><use href="#i-image"/></svg>':''}</a></td>
        <td style="max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.question_text}</td>
        <td><b>${s.student_answer||'（空）'}</b>${s.ocr_text?`<span class="ocr-text">OCR: ${s.ocr_text.slice(0,30)}</span>`:''}</td>
        <td>${s.standard_answer}</td><td><b>${s.score}</b></td><td>${status}</td>
        <td><button class="btn btn-sm" onclick="openReview(${s.id})"><svg class="icon"><use href="#i-eye"/></svg>看图复核</button></td>
      </tr>`}).join('')+'</tbody></table></div>';
}
function openReview(id){
  current=subs.find(s=>s.id===id);if(!current)return;
  verdict=current.is_correct?1:0;
  document.getElementById('mStudent').textContent='· '+current.student_name;
  document.getElementById('mQuestion').textContent=current.question_text;
  document.getElementById('mStandard').textContent=current.standard_answer;
  document.getElementById('mAnswer').value=current.student_answer||'';
  // 图片
  const img=document.getElementById('mImg'), empty=document.getElementById('mImgEmpty');
  if(current.image_path){
    img.src='/'+current.image_path.replace(/^\//,'');img.style.display='block';empty.style.display='none';
  }else{
    img.style.display='none';empty.style.display='flex';
  }
  setVerdict(verdict);
  document.getElementById('mTip').textContent=current.needs_review?'⚠ 此题为待复核，请人工判断':'';
  document.getElementById('modal').style.display='flex';
}
function closeModal(){document.getElementById('modal').style.display='none';current=null}
function setVerdict(v){
  verdict=v;
  document.getElementById('vYes').classList.toggle('selected',v===1);
  document.getElementById('vNo').classList.toggle('selected',v===0);
}
async function saveVerdict(){
  if(!current)return;
  const answer=document.getElementById('mAnswer').value.trim();
  const full=current.score||10;
  const score=verdict===1?full:0;
  Store.update('submissions',current.id,{student_answer:answer,score,is_correct:verdict===1?1:0,needs_review:0});
  // 更新学习记录：先删该生该题旧记录再写新的（简单去重）
  const q=Store.get('questions',current.question_id);
  if(q){
    Store.insert('learning_records',{student_id:current.student_id,knowledge_point:q.knowledge_point,
      correct:verdict===1?1:0,score,timestamp:new Date().toISOString()});
  }
  toast('批改结果已保存','ok');
  closeModal();loadSubmissions();
}
init();
</script>
</body>
</html>
