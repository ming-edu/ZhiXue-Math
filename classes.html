<div class="topbar">
  <div class="logo"><span class="logo-mark"><svg class="icon"><use href="#i-logo"/></svg></span>智学数学</div>
  <nav>
    <a href="index.html"><svg class="icon"><use href="#i-home"/></svg>概览</a>
    <a href="classes.html" class="active"><svg class="icon"><use href="#i-users"/></svg>班级管理</a>
    <a href="create.html"><svg class="icon"><use href="#i-clipboard"/></svg>布置作业</a>
    <a href="review.html"><svg class="icon"><use href="#i-check-circle"/></svg>批改中心</a>

<div class="container">
  <div class="page-header">
    <div>
      <a href="index.html" class="back-link"><svg class="icon"><use href="#i-chevron"/></svg>返回</a>
      <h1>班级管理</h1>
      <p>创建班级（自动生成唯一 8 位班号）、批量添加或删除学生。数据只保存在你这台设备。</p>
    </div>
  </div>

  <div class="two-col">
    <div class="panel">
      <h2><svg class="icon"><use href="#i-user-plus"/></svg>创建新班级</h2>
      <p class="panel-sub">班号由系统随机生成，8 位、全局唯一，用于标识班级。</p>
      <div class="form-group"><label>班级名称 <span class="req">*</span></label><input id="cName" placeholder="如：五年级(3)班"></div>
      <div class="form-row">
        <div class="form-group"><label>年级</label><input id="cGrade" placeholder="如：五年级"></div>
        <div class="form-group"><label>学期</label><select id="cSemester"><option>上册</option><option>下册</option></select></div>
      </div>
      <div class="form-group"><label>批量添加学生 <span style="color:var(--muted);font-weight:400">（一行一个姓名，可留空之后再加）</span></label>
        <textarea id="cStudents" rows="5" placeholder="张三&#10;李四&#10;王五"></textarea></div>
      <button class="btn btn-primary" onclick="createClass()"><svg class="icon"><use href="#i-plus"/></svg>创建班级</button>
    </div>

    <div class="panel">
      <h2><svg class="icon"><use href="#i-school"/></svg>已有班级</h2>
      <div id="classList"></div>
    </div>
  </div>

  <div class="panel" id="studentPanel" style="margin-top:18px;display:none">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px">
      <div><h2 style="margin:0"><svg class="icon"><use href="#i-users"/></svg><span id="stuClassName">班级学生</span></h2>
        <p class="panel-sub" style="margin-bottom:0">班号：<b id="stuClassCode" style="letter-spacing:2px;color:var(--brand-2)"></b> · 共 <span id="stuCount">0</span> 人</p></div>
      <button class="btn btn-sm btn-danger" onclick="deleteClass(currentCid)"><svg class="icon"><use href="#i-trash"/></svg>删除整个班级</button>
    </div>
    <hr class="divider">
    <div class="form-group"><label>批量添加学生（一行一个，自动去重）</label>
      <textarea id="addStudentsText" rows="3" placeholder="一行一个姓名"></textarea></div>
    <button class="btn btn-primary" onclick="addStudents()"><svg class="icon"><use href="#i-user-plus"/></svg>添加到本班</button>
    <div class="student-grid" id="studentGrid" style="margin-top:18px"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="static/ai.js"></script>
<script src="static/ai_settings.js"></script>
<script src="static/store.js"></script>
<script>
let currentCid=null;
function toast(m,t){const e=document.getElementById('toast');e.textContent=m;e.className='toast'+(t?' '+t:'');e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function parseNames(text){return (text||'').split(/\n|,|，|、|\s{2,}/).map(s=>s.trim()).filter(Boolean)}

function renderClasses(){
  const classes=Store.all('classes');
  document.getElementById('classList').innerHTML=classes.length?classes.map(c=>{
    const cnt=Store.where('students',s=>s.class_id===c.id).length;
    return `<div class="manage-class" onclick="openClass(${c.id})">
      <div class="mc-icon"><svg class="icon"><use href="#i-school"/></svg></div>
      <div class="mc-body"><b>${esc(c.name)}</b><div class="mc-meta">${esc(c.grade||'')} ${esc(c.semester||'')} · ${cnt}人 · <span class="code-chip">${esc(c.class_code)}</span></div></div>
      <svg class="icon mc-arrow"><use href="#i-arrow-right"/></svg>
    </div>`;
  }).join(''):'<div class="empty"><svg class="icon"><use href="#i-school"/></svg><p>还没有班级，左边创建一个</p></div>';
}
function openClass(cid){
  currentCid=cid;
  const c=Store.get('classes',cid);
  const stus=Store.where('students',s=>s.class_id===cid).sort((a,b)=>(a.student_no||0)-(b.student_no||0));
  document.getElementById('studentPanel').style.display='block';
  document.getElementById('stuClassName').textContent=c.name;
  document.getElementById('stuClassCode').textContent=c.class_code;
  document.getElementById('stuCount').textContent=stus.length;
  document.getElementById('studentGrid').innerHTML=stus.length?stus.map(s=>`
    <div class="student-chip"><span>${esc(s.name)}</span><button class="chip-x" onclick="delStudent(${s.id})" title="删除">✕</button></div>
  `).join(''):'<div class="empty"><p>本班还没有学生，在上方批量添加</p></div>';
  document.getElementById('studentPanel').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function createClass(){
  const name=document.getElementById('cName').value.trim();
  if(!name)return toast('请填写班级名称','err');
  const c=Store.createClass(name,document.getElementById('cGrade').value.trim(),document.getElementById('cSemester').value);
  const names=parseNames(document.getElementById('cStudents').value);
  if(names.length)Store.addStudents(c.id,names);
  toast(`已创建「${name}」，班号 ${c.class_code}${names.length?`，添加 ${names.length} 名学生`:''}`,'ok');
  document.getElementById('cName').value='';document.getElementById('cStudents').value='';
  renderClasses();openClass(c.id);
}
function addStudents(){
  if(!currentCid)return;
  const names=parseNames(document.getElementById('addStudentsText').value);
  if(!names.length)return toast('请先输入学生姓名（一行一个）','err');
  const added=Store.addStudents(currentCid,names);
  toast(`已添加 ${added.length} 名学生${names.length>added.length?'（'+ (names.length-added.length) +'个重复已跳过）':''}`,'ok');
  document.getElementById('addStudentsText').value='';
  openClass(currentCid);renderClasses();
}
function delStudent(sid){
  if(!confirm('确定删除这名学生？相关作答记录也会删除。'))return;
  Store.remove('students',sid);
  openClass(currentCid);renderClasses();toast('已删除学生','ok');
}
function deleteClass(cid){
  const c=Store.get('classes',cid);
  if(!confirm(`确定删除「${c.name}」及全部学生和作业数据吗？不可恢复。`))return;
  Store.deleteClass(cid);
  currentCid=null;document.getElementById('studentPanel').style.display='none';
  renderClasses();toast('班级已删除','ok');
}
(async function(){await Store.init();renderClasses()})();
</script>
</body>
</html>
